<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оцените наш сервис</title>
    <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
    <!-- Мягкий медитативный темный градиент (AmbientGradient - Amethyst) -->
    <div class="ambient-gradient-bg" data-variant="amethyst" aria-hidden="true">
        <div class="ambient-blob blob-1"></div>
        <div class="ambient-blob blob-2"></div>
        <div class="ambient-blob blob-3"></div>
        <div class="ambient-noise"></div>
    </div>

    <!-- GlassRatingCard -->
    <div class="glass-card-wrapper">
        <div class="glass-card" id="app-container">
            <!-- Внутреннее мягкое свечение в верхнем углу -->
            <div class="glass-card-glow" aria-hidden="true"></div>

            <!-- Состояние загрузки / ошибки -->
            <div id="status-message" class="status-message">Загрузка...</div>

            <!-- ШАГ 1: ВЫБОР ОЦЕНКИ (step === "rate") -->
            <div id="step-rate" class="card-step hidden">
                <div class="logo-box">
                    <img id="logo" src="" alt="Логотип" class="logo-img">
                    <div id="logo-fallback" class="logo-fallback hidden">T</div>
                </div>

                <h3 id="place-name" class="place-title">Название</h3>
                <p id="subtitle" class="place-subtitle">Пожалуйста, оцените наш сервис</p>

                <!-- Блок интерактивных звезд (Lucide Star SVG) -->
                <div class="stars-row" id="stars">
                    <button type="button" class="star-btn" data-value="1" aria-label="1 звезда">
                        <svg class="star-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </button>
                    <button type="button" class="star-btn" data-value="2" aria-label="2 звезды">
                        <svg class="star-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </button>
                    <button type="button" class="star-btn" data-value="3" aria-label="3 звезды">
                        <svg class="star-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </button>
                    <button type="button" class="star-btn" data-value="4" aria-label="4 звезды">
                        <svg class="star-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </button>
                    <button type="button" class="star-btn" data-value="5" aria-label="5 звезд">
                        <svg class="star-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </button>
                </div>
            </div>

            <!-- ШАГ 2: 4-5 ЗВЕЗД (step === "redirect") -->
            <div id="step-redirect" class="card-step step-center hidden">
                <div class="badge-emerald">
                    <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                </div>
                <h4 class="redirect-title">Спасибо за высокую оценку!</h4>
                <p class="redirect-subtitle">Перенаправляем вас на страницу 2ГИС...</p>
                <a id="redirect-link" href="https://2gis.kz" target="_blank" rel="noreferrer" class="redirect-btn">
                    <span>Открыть сейчас</span>
                    <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </a>
            </div>

            <!-- ШАГ 3: 1-3 ЗВЕЗДЫ (step === "complaint") -->
            <form id="step-complaint" class="card-step step-left hidden">
                <h4 class="complaint-title">Что нам улучшить?</h4>

                <textarea
                    id="complaint-input"
                    required
                    rows="3"
                    placeholder="Напишите, что пошло не так (блюдо, сервис, чистота)..."
                    class="complaint-textarea"
                ></textarea>

                <div class="complaint-actions">
                    <button type="button" id="back-btn" class="back-btn">Назад</button>
                    <button type="submit" id="submit-btn" class="submit-boss-btn">
                        <span id="submit-btn-text">Оставить отзыв</span>
                        <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
                    </button>
                </div>
            </form>

            <!-- ШАГ 4: ОТПРАВЛЕНО (step === "sent") -->
            <div id="step-sent" class="card-step step-center hidden">
                <div class="badge-amber">
                    <svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                </div>
                <h4 class="sent-title">Принято в работу</h4>
                <p class="sent-subtitle">Управляющий уже получил ваше замечание. Спасибо за честность!</p>
            </div>
        </div>
    </div>

    <script src="script.js?v=9"></script>
</body>
</html>
